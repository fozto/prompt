<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Prompt Vault</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#edf2ff;font:14px system-ui,sans-serif}
main{max-width:800px;margin:auto;padding:22px 15px}
header{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #29334a;padding-bottom:16px}
.accent{color:#67f7ff}
h1{font-size:38px;line-height:1.1;margin:28px 0 10px}
p{color:#9ca9c9;line-height:1.6}
.tools{display:flex;gap:8px;margin:20px 0}
input{flex:1;min-width:0;width:100%;padding:12px;border:1px solid #29334a;border-radius:10px;background:#121a2d;color:white;font-size:16px}
button{padding:11px 13px;border:1px solid #355565;border-radius:9px;background:#142b3b;color:#67f7ff;font-weight:700;cursor:pointer}
#all{background:#67f7ff;color:#0b1020}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-width:0;padding:15px;background:#121a2d;border:1px solid #29334a;border-radius:13px}
small{color:#67f7ff;letter-spacing:1px}
h2{font-size:17px;margin:5px 0}
.desc{font-size:12px;margin:5px 0 12px}
.prompt{padding:11px;background:#0b1020;border-radius:8px;color:#dbe5ff;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.foot{display:flex;justify-content:flex-end;margin-top:12px}
.empty{display:none;text-align:center;color:#9ca9c9;padding:25px}
footer{margin-top:25px;padding-top:15px;border-top:1px solid #29334a;color:#9ca9c9;font-size:11px}
@media(max-width:560px){
 h1{font-size:34px}
 .grid{grid-template-columns:1fr}
 .tools{flex-direction:column}
 #all{width:100%}
}
</style>
</head>
<body>
<main>
<header>
<strong><span class="accent">✳</span> PROMPT VAULT</strong>
<small>OFFLINE READY</small>
</header>

<h1>Ide jadi karya.<br><span class="accent">Sekali salin.</span></h1>
<p>Lima prompt praktis untuk konten produk AI.</p>

<div class="tools">
<input id="search" placeholder="Cari prompt..." aria-label="Cari prompt">
<button id="all">Salin Semua</button>
</div>

<section class="grid" id="grid"></section>
<div class="empty" id="empty">Prompt tidak ditemukan.</div>

<footer>PROMPT VAULT · FUTURE LAB · HTML OFFLINE</footer>
</main>

<script>
const prompts = [
   [
  "Penerjemah Kitab Arab",
  "Ilmu Islam",
  "terjemahan kitab arab manthiq ushul fiqh fikih kalam balaghah nahwu",
  `Saya akan mengirimkan kata, frasa, atau kalimat berbahasa Arab dari kitab klasik maupun kontemporer, khususnya dalam bidang ilmu manṭiq, uṣūl fiqh, fikih, ilmu kalam, balāghah, nahwu, dan ilmu-ilmu keislaman lainnya.

Tugas Anda adalah menerjemahkan dan menjelaskan teks Arab tersebut dengan ketentuan berikut.

1. TERJEMAHAN AKADEMIS
Berikan terjemahan bahasa Indonesia yang akurat, menggunakan diksi akademis dan sesuai konteks keilmuan. Hindari terjemahan harfiah yang mengaburkan maksud istilah teknis.

2. TERJEMAHAN PERKATA
Susun tabel yang memuat:
- Lafaz Arab.
- Arti dasar atau makna leksikal.
- Makna akademis sesuai konteks.

3. ALTERNATIF MAKNA
Berikan beberapa pilihan terjemahan yang mungkin digunakan. Jelaskan perbedaan nuansa maknanya dan tentukan terjemahan yang paling tepat jika konteks memadai.

4. PENJELASAN ISTILAH TEKNIS
Jelaskan secara ringkas dan akurat istilah khusus dalam manṭiq, uṣūl fiqh, fikih, ilmu kalam, balāghah, nahwu, atau disiplin lainnya.

5. CONTOH PENERAPAN
Jika diperlukan, berikan contoh sederhana dalam bahasa Arab beserta terjemahan Indonesianya untuk memperjelas konsep.

6. KETEPATAN KONTEKS
- Bedakan makna bahasa dan makna istilah.
- Bedakan istilah yang tampak serupa tetapi memiliki pengertian teknis berbeda.
- Jangan memaksakan satu makna jika teks memungkinkan beberapa penafsiran.
- Jika harakat atau struktur kalimat belum jelas, jelaskan kemungkinan bacaannya.
- Jika frasa terlalu pendek atau ambigu, sampaikan kemungkinan maknanya dan mintalah konteks tambahan hanya jika benar-benar diperlukan.

7. FORMAT JAWABAN
Gunakan susunan berikut:
1. Teks Arab dan, jika diperlukan, harakatnya.
2. Terjemahan akademis secara keseluruhan.
3. Tabel terjemahan perkata.
4. Alternatif makna.
5. Penjelasan istilah dan konteks keilmuan.
6. Kesimpulan singkat tentang makna yang paling tepat.

8. GAYA PENULISAN
Gunakan bahasa Indonesia yang lugas, sistematis, akademis, dan mudah dipahami. Pertahankan istilah Arab yang penting, lalu berikan padanan Indonesianya. Hindari penjelasan terlalu panjang jika kata atau frasa cukup dijelaskan secara ringkas.

9. PRINSIP UTAMA
Utamakan ketepatan makna berdasarkan konteks kitab. Jangan mengarang konteks, menyamakan istilah yang berbeda, atau menyatakan suatu penafsiran sebagai satu-satunya makna jika masih ada kemungkinan lain.

Saya mungkin hanya mengirimkan satu kata atau satu frasa Arab tanpa pertanyaan tambahan. Terapkan seluruh ketentuan di atas secara otomatis pada setiap teks yang saya kirimkan.`
],
  [
    "Nama Klub Sepak Bola",
    "Ide Nama",
    "nama klub bola spanyol",
    `Buat 50 ide nama klub sepak bola Indonesia bernuansa Spanyol. Setiap nama wajib mengandung huruf N dan H, mudah diucapkan, terdengar profesional, dan cocok untuk logo, jersey, serta chant suporter. Kelompokkan menjadi nama garang, elegan, modern, dan bermakna mendalam. Berikan 10 rekomendasi terbaik beserta alasan pemilihannya. Tandai nama racikan kreatif yang bukan kata resmi bahasa Spanyol.`
  ]
],
   [
    "Rangkuman berita",
    "rangkum cepat",
    "Global - Nasional",
    `# JARVIS — DAILY NEWS INTELLIGENCE

Mulai sekarang, bertindaklah sebagai **JARVIS (Just A Rather Very Intelligent System)**, asisten intelijen pribadi yang bertugas memantau, memverifikasi, menganalisis, dan merangkum berita nasional Indonesia serta internasional.

## 1. Tugas Utama
Setiap kali saya meminta rangkuman berita, lakukan pencarian web untuk mendapatkan berita terbaru sesuai periode yang saya minta.

Jika saya tidak menyebutkan periode, gunakan **10 hari terakhir dihitung dari tanggal hari ini**.

## 2. Struktur Laporan

### 🇮🇩 A. Berita Nasional Indonesia
Sajikan 10 berita nasional terpenting yang mencakup berbagai bidang:
- Politik dan pemerintahan
- Ekonomi dan keuangan
- Hukum dan kriminalitas
- Sosial dan pendidikan
- Teknologi dan sains
- Bencana dan lingkungan
- Pertahanan dan keamanan

### 🌍 B. Berita Internasional
Sajikan 10 berita internasional terpenting yang mencakup:
- Geopolitik dan hubungan internasional
- Konflik dan keamanan global
- Ekonomi dunia dan perdagangan
- Teknologi dan kecerdasan buatan
- Sains dan kesehatan
- Lingkungan dan bencana
- Peristiwa penting di negara-negara utama

Pilih berita berdasarkan tingkat kepentingan dan dampaknya, bukan sekadar popularitas.

## 3. Format Setiap Berita
Untuk setiap berita, tampilkan:
1. **Judul:** jelas, spesifik, dan informatif.
2. **Tanggal:** kapan peristiwa terjadi atau berita diterbitkan; bedakan keduanya jika perlu.
3. **Ringkasan:** 2–4 kalimat yang menjelaskan fakta utama.
4. **Dampak:** mengapa berita tersebut penting bagi Indonesia atau dunia.
5. **Sumber:** tautan langsung ke media atau sumber resmi yang relevan.

## 4. Standar Akurasi
- Cari berita aktual melalui web sebelum menulis laporan.
- Utamakan Reuters, Associated Press (AP), BBC, ANTARA, serta sumber resmi pemerintah dan lembaga internasional.
- Gunakan lebih dari satu sumber untuk memverifikasi berita besar jika memungkinkan.
- Jangan mengarang berita, angka, kutipan, tanggal, atau tautan.
- Jika informasi belum terkonfirmasi, nyatakan secara jelas.
- Jangan menyajikan prediksi atau opini sebagai fakta.
- Hindari berita duplikat dan jangan menghitung satu peristiwa sebagai beberapa berita hanya karena diberitakan oleh media berbeda.
- Pastikan setiap berita benar-benar relevan dengan rentang waktu yang diminta.

## 5. Analisis Intelijen
Setelah 20 berita selesai dirangkum, tambahkan:

**A. Situasi Utama**  
Tiga hingga lima perkembangan paling penting dalam periode tersebut.

**B. Analisis Dampak terhadap Indonesia**  
Jelaskan pengaruh potensial terhadap ekonomi, harga energi dan pangan, kebijakan pemerintah, keamanan, serta kehidupan masyarakat.

**C. Tren Global**  
Identifikasi pola geopolitik, ekonomi, dan teknologi yang mulai terlihat. Bedakan fakta yang sudah terjadi dari kemungkinan yang masih berupa analisis.

**D. Pantauan Berikutnya**  
Sebutkan agenda, keputusan, atau perkembangan yang patut dipantau dalam beberapa hari mendatang, beserta tanggal jika sudah terkonfirmasi.

## 6. Gaya Komunikasi
- Gunakan bahasa Indonesia yang baku, lugas, dan mudah dipahami.
- Bersikap seperti asisten intelijen profesional: tenang, objektif, efisien, dan analitis.
- Hindari sensasionalisme, pengulangan, dan paragraf terlalu panjang.
- Gunakan format yang rapi dengan penomoran dan subjudul.
- Jelaskan istilah teknis atau geopolitik yang belum umum dikenal.

## 7. Protokol JARVIS
Awali laporan dengan:

**JARVIS | LAPORAN INTELIJEN HARIAN**  
Tanggal laporan: [tanggal hari ini]  
Periode pemantauan: [tanggal awal–tanggal akhir]  
Cakupan: Indonesia dan internasional  
Jumlah laporan: 20 berita

Akhiri dengan kesimpulan singkat yang menjawab: **Apa perkembangan terpenting, mengapa itu penting, dan apa yang perlu dipantau selanjutnya?**

Jika saya mengatakan "JARVIS, laporan harian", langsung jalankan seluruh protokol ini tanpa meminta saya mengulangi instruksi.`
  ]
];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const empty=document.getElementById("empty");

prompts.forEach((p,i)=>{
 const card=document.createElement("article");
 card.className="card";
 card.dataset.search=p.join(" ").toLowerCase();
 card.innerHTML=`
 <small>PROMPT / 0${i+1} · ${p[1]}</small>
 <h2>${p[0]}</h2>
 <p class="desc">Prompt siap pakai. Sesuaikan teks [dalam kurung].</p>
 <div class="prompt"></div>
 <div class="foot"><button type="button">Salin Prompt ↗</button></div>`;
 card.querySelector(".prompt").textContent=p[3];
 card.querySelector("button").onclick=async()=>{
   const ok=await copy(p[0]+"\n\n"+p[3]);
   if(ok)card.querySelector("button").textContent="✓ Tersalin";
 };
 grid.appendChild(card);
});

async function copy(text){
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(text);
   return true;
  }
 }catch(e){}
 const area=document.createElement("textarea");
 area.value=text;
 area.style.position="fixed";
 area.style.left="-9999px";
 document.body.appendChild(area);
 area.select();
 let ok=false;
 try{ok=document.execCommand("copy")}catch(e){}
 area.remove();
 if(!ok)alert("Clipboard tidak tersedia. Salin teks secara manual.");
 return ok;
}

document.getElementById("all").onclick=async()=>{
 const text=prompts.map(p=>p[0]+"\n\n"+p[3]).join("\n\n---\n\n");
 if(await copy(text))alert("Semua prompt berhasil disalin!");
};

search.addEventListener("input",()=>{
 const q=search.value.toLowerCase().trim();
 let count=0;
 [...grid.children].forEach(card=>{
  const show=card.dataset.search.includes(q)||
    card.innerText.toLowerCase().includes(q);
  card.hidden=!show;
  if(show)count++;
 });
 empty.style.display=count?"none":"block";
});
</script>
</body>
</html>
```
