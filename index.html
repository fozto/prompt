<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Prompt Vault</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#edf2ff;font:14px system-ui,sans-serif}
main{max-width:800px;margin:auto;padding:22px 15px}
header{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #29334a;padding-bottom:16px}
.accent{color:#67f7ff}
h1{font-size:38px;line-height:1.1;margin:28px 0 10px}
p{color:#9ca9c9;line-height:1.6}
.tools{display:flex;gap:8px;margin:20px 0}
input{flex:1;min-width:0;width:100%;padding:12px;border:1px solid #29334a;border-radius:10px;background:#121a2d;color:white;font-size:16px}
button{padding:11px 13px;border:1px solid #355565;border-radius:9px;background:#142b3b;color:#67f7ff;font-weight:700;cursor:pointer}
#all{background:#67f7ff;color:#0b1020}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-width:0;padding:15px;background:#121a2d;border:1px solid #29334a;border-radius:13px}
small{color:#67f7ff;letter-spacing:1px}
h2{font-size:17px;margin:5px 0}
.desc{font-size:12px;margin:5px 0 12px}
.prompt{padding:11px;background:#0b1020;border-radius:8px;color:#dbe5ff;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.foot{display:flex;justify-content:flex-end;margin-top:12px}
.empty{display:none;text-align:center;color:#9ca9c9;padding:25px}
footer{margin-top:25px;padding-top:15px;border-top:1px solid #29334a;color:#9ca9c9;font-size:11px}
@media(max-width:560px){
 h1{font-size:34px}
 .grid{grid-template-columns:1fr}
 .tools{flex-direction:column}
 #all{width:100%}
}
</style>
</head>
<body>
<main>
<header>
<strong><span class="accent">✳</span> PROMPT VAULT</strong>
<small>OFFLINE READY</small>
</header>

<h1>Ide jadi karya.<br><span class="accent">Sekali salin.</span></h1>
<p>Lima prompt praktis untuk konten produk AI.</p>

<div class="tools">
<input id="search" placeholder="Cari prompt..." aria-label="Cari prompt">
<button id="all">Salin Semua</button>
</div>

<section class="grid" id="grid"></section>
<div class="empty" id="empty">Prompt tidak ditemukan.</div>

<footer>PROMPT VAULT · FUTURE LAB · HTML OFFLINE</footer>
</main>

<script>
const prompts=[
["Video Iklan Produk","Video AI","video iklan tiktok reels",
`Buat video iklan [PRODUK] berdurasi 8–10 detik, vertikal 9:16. Gunakan gambar referensi untuk menjaga bentuk, warna, label, dan detail produk. Tampilkan talent Indonesia berhijab di [LOKASI], gerakan natural, hook visual menarik, demonstrasi singkat, dan penutup yang menampilkan produk dengan jelas. Pencahayaan estetik. Tanpa teks tambahan, watermark, atau perubahan desain produk.`],
["Nama klub,
 `50 Ide Nama Klub Sepak Bola Indonesia Bernuansa Spanyol: A. Sangar dan Garang: 1. Leónh (makna simbolis: singa perkasa yang melambangkan kekuatan dan keberanian); 2. Honrón (makna simbolis: petarung terhormat yang pantang menyerah); 3. Bravón (makna simbolis: sosok pemberani dengan mental baja); 4. Fénhix (makna simbolis: kebangkitan dan kekuatan seperti burung phoenix); 5. Torhán (makna simbolis: banteng tangguh yang tak mudah ditaklukkan); 6. Sanghéro (makna simbolis: pahlawan yang berjuang dengan gagah berani); 7. Truenho (makna simbolis: kekuatan dahsyat seperti guntur); 8. Dragónh (makna simbolis: naga perkasa yang ditakuti lawan); 9. Guerrón (makna simbolis: pejuang tangguh yang selalu siap bertarung); 10. Valhón (makna simbolis: keberanian dan kekuatan seorang kesatria); 11. Hierón (makna simbolis: keteguhan seperti besi); 12. Titanh (makna simbolis: raksasa kuat dengan mental juara); 13. Furhán (makna simbolis: amarah kompetitif dan semangat membara). B. Elegan Seperti Klub Profesional Spanyol: 14. Unión Real (persatuan kerajaan, melambangkan kebanggaan dan kehormatan); 15. Honra FC (honra berarti kehormatan dalam bahasa Spanyol); 16. León Norte (singa utara, simbol kekuatan dan identitas); 17. Nuevo Horizonte (cakrawala baru, simbol harapan dan masa depan); 18. Hispanh (makna simbolis: identitas Hispanik dengan sentuhan modern); 19. Sanhéro (makna simbolis: klub berjiwa kesatria dan bermartabat); 20. Montenh (makna simbolis: kekuatan kokoh seperti pegunungan); 21. Reinhold (makna simbolis: kepemimpinan dan kehormatan, dengan nuansa nama Eropa); 22. Honorán (makna simbolis: kehormatan dan kewibawaan klub); 23. Valenhor (makna simbolis: keberanian dan kehormatan dalam satu identitas); 24. Granhéro (makna simbolis: pahlawan besar yang membawa kebanggaan); 25. Novahén (makna simbolis: awal baru dengan karakter elegan). C. Unik dan Modern: 26. Nohara (makna simbolis: kekuatan kolektif dan identitas khas); 27. Henova (makna simbolis: pembaruan, inovasi, dan semangat juang); 28. Nharvo (makna simbolis: ketangguhan dan keberanian modern); 29. Honvex (makna simbolis: kehormatan dengan karakter agresif); 30. Nexhón (makna simbolis: generasi baru yang bermental juara); 31. Nohvian (makna simbolis: perjalanan menuju kejayaan); 32. Hanvero (makna simbolis: keberanian dan loyalitas); 33. Nuvharo (makna simbolis: kebangkitan klub dengan energi baru); 34. Harnexo (makna simbolis: persatuan dan koneksi antarpemain); 35. Nahrion (makna simbolis: kekuatan yang tumbuh dari kebersamaan); 36. Vanhéro (makna simbolis: kesatria modern yang berani); 37. Orhena (makna simbolis: kebanggaan, kehormatan, dan identitas unik). D. Memiliki Makna Mendalam: 38. Honor (kehormatan, martabat, dan integritas); 39. Unión (persatuan dan kebersamaan); 40. Triunfo (kemenangan dan keberhasilan); 41. Esperanza (harapan dan keyakinan akan masa depan); 42. Fortaleza (kekuatan, ketahanan, dan benteng yang kokoh); 43. Hermandad (persaudaraan dan solidaritas); 44. Honradez (kejujuran dan integritas); 45. Lealtad (kesetiaan dan loyalitas); 46. Renhova (makna simbolis: pembaruan dan kebangkitan); 47. Alhanza (makna simbolis: aliansi dan persatuan); 48. Valhencia (makna simbolis: keberanian dan kejayaan); 49. Enhorna (makna simbolis: kehormatan yang ditempa melalui perjuangan); 50. Triunhón (makna simbolis: kemenangan besar dan mental juara). 10 Nama Terbaik: 1. Leónh — pendek, garang, dan memiliki simbol singa yang kuat untuk logo serta maskot; 2. Honra FC — elegan, mudah diucapkan, dan bermakna kehormatan; 3. Guerrón — terdengar agresif dan cocok untuk klub dengan identitas petarung; 4. Unión Real — terasa profesional, berkelas, dan menonjolkan persatuan; 5. Nexhón — modern, unik, dan mudah dijadikan identitas digital; 6. Triunhón — memiliki nuansa kemenangan besar dan cocok untuk chant suporter; 7. Valenhor — terdengar tegas serta menggabungkan makna keberanian dan kehormatan; 8. Henova — ringkas, futuristis, dan mudah diaplikasikan pada jersey; 9. León Norte — kuat secara visual dan cocok untuk identitas klub regional; 10. Hermandad — memiliki makna persaudaraan yang mendalam dan cocok untuk membangun loyalitas suporter. Catatan: semua nama di atas mengandung huruf N dan H, tetapi sejumlah nama merupakan racikan kreatif sehingga artinya bersifat simbolis, bukan arti resmi dalam bahasa Spanyol.`
["Foto Produk","Gambar AI","foto katalog produk aesthetic",
`Buat foto komersial premium [PRODUK] dengan latar [LOKASI]. Pertahankan bentuk, warna, kemasan, label, dan detail sesuai referensi. Gunakan pencahayaan lembut, bayangan realistis, komposisi minimalis, detail tajam, dan rasio [RASIO]. Jangan menambahkan tulisan atau produk lain.`],
["Voice Over Hook","Naskah","voice over hook jualan",
`Buat 5 voice over iklan [PRODUK], maksimal 8 detik masing-masing. Gunakan bahasa Indonesia natural dengan hook kuat pada 2 detik pertama. Tonjolkan manfaat nyata [MANFAAT] dan akhiri dengan ajakan melihat produk. Hindari klaim berlebihan. Tampilkan naskah saja.`],
["Caption & Hashtag","Sosial","caption hashtag tiktok seo",`Buat 5 konsep video [PRODUK] untuk [PLATFORM]. Setiap konsep berisi hook 2 detik, urutan adegan, manfaat produk, voice over singkat, dan penutup. Variasikan demonstrasi, masalah-solusi, detail produk, rutinitas, dan rekomendasi. Pastikan realistis dan tanpa klaim yang belum terbukti.`]
];

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const empty=document.getElementById("empty");

prompts.forEach((p,i)=>{
 const card=document.createElement("article");
 card.className="card";
 card.dataset.search=p.join(" ").toLowerCase();
 card.innerHTML=`
 <small>PROMPT / 0${i+1} · ${p[1]}</small>
 <h2>${p[0]}</h2>
 <p class="desc">Prompt siap pakai. Sesuaikan teks [dalam kurung].</p>
 <div class="prompt"></div>
 <div class="foot"><button type="button">Salin Prompt ↗</button></div>`;
 card.querySelector(".prompt").textContent=p[3];
 card.querySelector("button").onclick=async()=>{
   const ok=await copy(p[0]+"\n\n"+p[3]);
   if(ok)card.querySelector("button").textContent="✓ Tersalin";
 };
 grid.appendChild(card);
});

async function copy(text){
 try{
  if(navigator.clipboard&&window.isSecureContext){
   await navigator.clipboard.writeText(text);
   return true;
  }
 }catch(e){}
 const area=document.createElement("textarea");
 area.value=text;
 area.style.position="fixed";
 area.style.left="-9999px";
 document.body.appendChild(area);
 area.select();
 let ok=false;
 try{ok=document.execCommand("copy")}catch(e){}
 area.remove();
 if(!ok)alert("Clipboard tidak tersedia. Salin teks secara manual.");
 return ok;
}

document.getElementById("all").onclick=async()=>{
 const text=prompts.map(p=>p[0]+"\n\n"+p[3]).join("\n\n---\n\n");
 if(await copy(text))alert("Semua prompt berhasil disalin!");
};

search.addEventListener("input",()=>{
 const q=search.value.toLowerCase().trim();
 let count=0;
 [...grid.children].forEach(card=>{
  const show=card.dataset.search.includes(q)||
    card.innerText.toLowerCase().includes(q);
  card.hidden=!show;
  if(show)count++;
 });
 empty.style.display=count?"none":"block";
});
</script>
</body>
</html>
```
