<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#edf2ff;font:14px system-ui,sans-serif}
main{max-width:800px;margin:auto;padding:22px 15px}
header{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #29334a;padding-bottom:16px}
.accent{color:#67f7ff}
h1{font-size:38px;line-height:1.1;margin:28px 0 10px}
p{color:#9ca9c9;line-height:1.6}
.tools{display:flex;gap:8px;margin:20px 0}
input{flex:1;min-width:0;width:100%;padding:12px;border:1px solid #29334a;border-radius:10px;background:#121a2d;color:white;font-size:16px}
button{padding:11px 13px;border:1px solid #355565;border-radius:9px;background:#142b3b;color:#67f7ff;font-weight:700;cursor:pointer}
#all{background:#67f7ff;color:#0b1020}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-width:0;padding:15px;background:#121a2d;border:1px solid #29334a;border-radius:13px}
small{color:#67f7ff;letter-spacing:1px}
h2{font-size:17px;margin:5px 0}
.desc{font-size:12px;margin:5px 0 12px}
.prompt{padding:11px;background:#0b1020;border-radius:8px;color:#dbe5ff;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.foot{display:flex;justify-content:flex-end;margin-top:12px}
.empty{display:none;text-align:center;color:#9ca9c9;padding:25px}
footer{margin-top:25px;padding-top:15px;border-top:1px solid #29334a;color:#9ca9c9;font-size:11px}
@media(max-width:560px){
 h1{font-size:34px}
 .grid{grid-template-columns:1fr}
 .tools{flex-direction:column}
 #all{width:100%}
}
</style>
</head>
<body>
<main>
<header>
<strong><span class="accent">✳</span> PROMPT VAULT</strong>
<small>OFFLINE READY</small>
</header>

<h1>Ide jadi karya.<br><span class="accent">Sekali salin.</span></h1>
<p>Lima prompt praktis untuk konten produk AI.</p>

<div class="tools">
<input id="search" placeholder="Cari prompt..." aria-label="Cari prompt">
<button id="all">Salin Semua</button>
</div>

<section class="grid" id="grid"></section>
<div class="empty" id="empty">Prompt tidak ditemukan.</div>

<footer>PROMPT VAULT · FUTURE LAB · HTML OFFLINE</footer>
</main>

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

function renderPrompts() {
  grid.innerHTML = "";

  prompts.forEach((p, i) => {
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.search = p.join(" ").toLowerCase();

    const label = document.createElement("small");
    label.textContent = `PROMPT / ${String(i + 1).padStart(2, "0")} · ${p[1]}`;

    const title = document.createElement("h2");
    title.textContent = p[0];

    const desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = "Prompt siap pakai. Sesuaikan dengan kebutuhan.";

    const content = document.createElement("div");
    content.className = "prompt";
    content.textContent = p[3];

    const foot = document.createElement("div");
    foot.className = "foot";

    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "Salin Prompt ↗";

    button.addEventListener("click", async () => {
      const ok = await copy(p[0] + "\n\n" + p[3]);

      if (ok) {
        button.textContent = "✓ Tersalin";
        setTimeout(() => {
          button.textContent = "Salin Prompt ↗";
        }, 1500);
      }
    });

    foot.appendChild(button);
    card.append(label, title, desc, content, foot);
    grid.appendChild(card);
  });

  filterPrompts();
}

async function copy(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {
    // Lanjutkan ke metode cadangan.
  }

  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();

  let ok = false;

  try {
    ok = document.execCommand("copy");
  } catch (e) {
    ok = false;
  }

  area.remove();

  if (!ok) {
    alert("Penyalinan otomatis gagal. Silakan salin teks secara manual.");
  }

  return ok;
}

document.getElementById("all").addEventListener("click", async () => {
  const text = prompts
    .map(p => p[0] + "\n\n" + p[3])
    .join("\n\n---\n\n");

  const ok = await copy(text);

  if (ok) {
    alert("Semua prompt berhasil disalin!");
  }
});

function filterPrompts() {
  const q = search.value.toLowerCase().trim();
  let count = 0;

  [...grid.children].forEach(card => {
    const show = card.dataset.search.includes(q);
    card.hidden = !show;

    if (show) count++;
  });

  empty.style.display = count ? "none" : "block";
}

search.addEventListener("input", filterPrompts);

renderPrompts();
</script>
